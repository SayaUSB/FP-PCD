[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "retina-seg"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "scikit-image",
    "scikit-learn",
    "imbalanced-learn",
    "numpy",
    "matplotlib",
    "streamlit",
    "joblib",
    "Pillow",
    "scipy",
    "pandas",
]

[tool.setuptools.packages.find]
where = ["src"]
